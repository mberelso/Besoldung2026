              "@type": "Question",
              "name": "Was ändert sich durch das BAlimentG für Beamte beim Bund 2026?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Der Referentenentwurf zum Bundesalimentationsgesetz (BAlimentG) sieht eine grundlegende Reform der Besoldungsstruktur für Bundesbeamte ab Mai 2026 vor. Neben angepassten Tabellen werden Familienzuschläge völlig neu strukturiert. Um die vom Bundesverfassungsgericht geforderte amtsangemessene Alimentation auch rückwirkend ab 2021 sicherzustellen, sind weitreichende Einmal- und Nachzahlungen vorgesehen."
              }
            },
            {
              "@type": "Question",
              "name": "Wie hoch fällt die Beamten-Nachzahlung ab 2021 (Bund) aus?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die Nachzahlung setzt sich aus verschiedenen Töpfen zusammen: eine pauschale Einmalzahlung von 138 € für 2021 (§ 79b), kindbezogene monatliche Nachzahlungen für das erste und zweite Kind (§ 79d) sowie – bei besonderen Lebenslagen wie Elternzeit oder Pflege – der rückwirkende ergänzende Familienzuschlag (§ 79a). Der individuelle Betrag lässt sich mit dem Rechner berechnen."
              }
            },
            {
              "@type": "Question",
              "name": "Wer profitiert von der Tabellenreform und der 3%-Anhebung?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ab dem 1. Mai 2026 werden die Tabellenwerte für die Bundesbesoldungsordnungen A, B, R und W komplett neu gefasst. Die bisherigen Laufbahnzuschläge entfallen. Bereits ab Juli 2025 bis April 2026 sind die Bezüge pauschal um 3 % angehoben worden."
              }
            },
            {
              "@type": "Question",
              "name": "Was ist der ergänzende Familienzuschlag nach § 41 bzw. § 41a?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Der ergänzende Familienzuschlag (EFZ) wird Beamten gewährt, deren Ehegatte wegen Elternzeit, Pflege eines Angehörigen oder dauerhafter Erwerbsunfähigkeit kein oder nur geringes Einkommen hat. § 41a erfasst Alleinerziehende mit mindestens 2 Kindern. Rückwirkend ab 2021 erfolgt eine Nachzahlung über § 79a."
              }
            },
            {
              "@type": "Question",
              "name": "Wann kommt die Nachzahlung – muss ich einen Antrag stellen?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Laut Referentenentwurf sollen die Nachzahlungen von Amts wegen automatisch durch die Bezügestelle ausgezahlt werden, ohne gesonderten Antrag. Ausnahme: § 79e (3+ Kinder) wird individuell per Rechtsverordnung festgesetzt. Das Gesetz ist noch nicht in Kraft getreten."
              }
            },
            {
              "@type": "Question",
              "name": "Gilt der Rechner auch für Landesbeamte?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nein. Der Rechner bezieht sich ausschließlich auf Bundesbeamte (Bundesbesoldungsordnungen A, B, W, R). Die Bundesländer haben eigene Besoldungsgesetze und setzen Urteile des Bundesverfassungsgerichts eigenständig um."
              }
            },
            {
              "@type": "Question",
              "name": "Was passiert mit Erfahrungsstufe 1 bei A-Besoldung ab Mai 2026?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "In der neuen Tabelle ab Mai 2026 entfällt Stufe 1 für alle A-Besoldungsgruppen. Wer bisher in Stufe 1 war, wird automatisch in Stufe 2 eingruppiert. Der Rechner berücksichtigt dies bereits."
              }
            }
