<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.06)"/>
    </linearGradient>
    <!-- Blob decorations -->
    <radialGradient id="blob1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <ellipse cx="150" cy="150" rx="280" ry="280" fill="url(#blob1)"/>
  <ellipse cx="1100" cy="500" rx="320" ry="320" fill="url(#blob2)"/>

  <!-- Card -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Top label -->
  <rect x="100" y="105" width="260" height="36" rx="18" fill="#6366f1" fill-opacity="0.9"/>
  <text x="230" y="129" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">BUNDESBEAMTE · BUND</text>

  <!-- Main headline -->
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="white">Besoldungs- &amp;</text>
  <text x="100" y="278" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="white">Nachzahlungsrechner</text>

  <!-- Subline -->
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="26" fill="#a5b4fc">BAlimentG-Referentenentwurf · Rückwirkend ab 2021</text>

  <!-- Divider -->
  <line x1="100" y1="365" x2="1100" y2="365" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Feature boxes -->
  <!-- Box 1 -->
  <rect x="100" y="388" width="290" height="130" rx="14" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <text x="245" y="428" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#a5b4fc" text-anchor="middle">§§ 79a–79e</text>
  <text x="245" y="456" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">Nachzahlungen</text>
  <text x="245" y="476" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">rückwirkend ab 2021</text>
  <text x="245" y="503" font-family="Arial, sans-serif" font-size="13" fill="#818cf8" text-anchor="middle">individuell berechnet</text>

  <!-- Box 2 -->
  <rect x="415" y="388" width="290" height="130" rx="14" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <text x="560" y="428" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">A3 – R10</text>
  <text x="560" y="456" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">Alle Besoldungsordnungen</text>
  <text x="560" y="476" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">inkl. neue Tabellen</text>
  <text x="560" y="503" font-family="Arial, sans-serif" font-size="13" fill="#818cf8" text-anchor="middle">ab Mai 2026</text>

  <!-- Box 3 -->
  <rect x="730" y="388" width="290" height="130" rx="14" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <text x="875" y="428" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fbbf24" text-anchor="middle">Netto-Rechner</text>
  <text x="875" y="456" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">Steuerklassen, PKV,</text>
  <text x="875" y="476" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">Kirchensteuer</text>
  <text x="875" y="503" font-family="Arial, sans-serif" font-size="13" fill="#818cf8" text-anchor="middle">inkl. Sonderfälle</text>

  <!-- URL bottom right -->
  <text x="1100" y="548" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.4" text-anchor="end">mberelso.github.io/Besoldung2026</text>
</svg>
